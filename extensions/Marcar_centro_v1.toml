# Copy this file to extensions/<id>.toml and fill it in.
# Copia este archivo a extensions/<id>.toml y rellénalo.
# Copie este arquivo para extensions/<id>.toml e preencha.

# Same as the file name: lowercase letters, digits and _.
id = "Marcar_centro_v1"
version = "1.0"
author = "ArkSamuelGarcia"
# author_url = "https://github.com/ArkSamuelGarcia"            # optional

# SPDX name of a free licence: MIT, GPL-3.0-or-later, Apache-2.0, BSD-3-Clause…
license = " GPL-3.0"

# Where people read your code.
repository = "https://github.com/ArkSamuelGarcia/Marcar_Centro"

# The exact file IngeTrazo users will install: a .py file, or a .zip holding
# ONE folder with an __init__.py. Use a TAG or a COMMIT in the address, not
# «main»: what is reviewed must not change afterwards.
download = "https://raw.githubusercontent.com/you/my-extension/v1.0/my_extension.py"
# sha256sum Marcar centro v1.py      (Windows: certutil -hashfile my_extension.py SHA256)
# If it is wrong, the check tells you the right one.
sha256 = "c639e73ca5b105958b2524ed44fa640cc5a3c24264b8e02b8b5acb2d0056dd90"

# The IngeTrazo version you tested with.
ingetrazo = "0.5.9"

# 1 to 4 of: architecture, bim, structures, terrain, drawing, analysis,
# import-export, rendering, fabrication, productivity, education, other
tags = ["drawing"]

# Optional: a picture in screenshots/ (png, jpg or webp, under 600 KB, ~1200×750).
# screenshot = "my_extension.png"

# At least Spanish OR English. Portuguese is welcome. Machine translation is
# fine — the page shows the visitor's language when it is there.
[name]
es = "Marcar_centro_v1"
en = "Mark_center_v1"
pt = "Marcar_centro_v1"

[summary]   # one or two sentences, up to 240 characters
es = "Marca el centro de un circulo o arco."
en = "Mark the center of a circle or arc."
pt = "Marque o centro de um círculo ou arco."
